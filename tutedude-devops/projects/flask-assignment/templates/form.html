<!DOCTYPE html>
<html>
<head>
    <title>Submit Data</title>
</head>
<body>

<h2>Submit Data</h2>

{% if error %}
    <p style="color:red;">{{ error }}</p>
{% endif %}

<form action="/submit" method="POST">
    <input type="text" name="itemID" placeholder="Item ID"><br><br>
    <input type="text" name="itemName" placeholder="Item Name"><br><br>
    <input type="text" name="itemDescription" placeholder="Item Description"><br><br>
    <input type="text" name="itemUUID" placeholder="Item UUID"><br><br>
    <input type="text" name="itemHash" placeholder="Item Hash"><br><br>
    <button type="submit">Submit</button>
</form>

</body>
</html>
